[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsetmc-gateway"
version = "0.1.0"
description = "JSON gateway for the Tehran Stock Exchange (TSETMC) Market Watch feed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tsetmc-gateway = "tsetmc_gateway.__main__:main"

[tool.setuptools]
packages = ["tsetmc_gateway"]
